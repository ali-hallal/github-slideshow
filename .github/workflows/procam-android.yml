name: ProCam Android build

on:
  push:
    paths:
      - "ProCam/**"
      - ".github/workflows/procam-android.yml"
  pull_request:
    paths:
      - "ProCam/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ProCam
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: ProCam-debug-apk
          path: ProCam/app/build/outputs/apk/debug/*.apk
