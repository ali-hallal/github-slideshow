name: ProCam Android build

on:
  push:
    paths:
      - "ProCam/**"
      - ".github/workflows/procam-android.yml"
  pull_request:
    paths:
      - "ProCam/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ProCam
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: ProCam-debug-apk
          path: ProCam/app/build/outputs/apk/debug/*.apk

  emulator-test:
    # Runs the app on an Android emulator with a virtual camera and takes real photos.
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: ProCam
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build app and test APKs
        run: ./gradlew assembleDebug assembleDebugAndroidTest --no-daemon

      - name: Run tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back emulated -camera-front emulated
          working-directory: ProCam
          script: |
            adb logcat -c
            ./gradlew connectedDebugAndroidTest --no-daemon || touch tests-failed
            adb logcat -d -v time ProCam:V ProCamTest:V AndroidRuntime:E CameraService:W '*:S' | tail -300
            adb pull /sdcard/Download/procam-screens screens || true
            for f in screens/*.jpg; do echo "=== SCREEN $(basename $f)"; base64 -w 2000 "$f"; echo "=== END"; done
            test ! -f tests-failed

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ProCam-emulator-test-report
          path: |
            ProCam/app/build/reports/androidTests/
            ProCam/screens/
